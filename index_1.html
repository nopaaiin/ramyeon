
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麵道 · 0</title>
<style>
  /* ===== 확정 수치 (27인치 5K 아이맥 기준) =====
     화면 표시영역 : 2560 x 1440 (CSS px)
     환율          : 1cm = 42.83 CSS px
     마름모(실물책) : 대각선 1440px, 중심 (1280,720)
     실물 책        : 23.76cm 정방형
  ================================================= */
  :root {
    --stage-w: 2560;      /* 기준 폭 */
    --stage-h: 1440;      /* 기준 높이 */
    --rhombus-diag: 1440; /* 마름모 대각선(px) */
    --pink: #f45ba8;      /* 배경 핑크(글로우 색) */
    --pink-soft: #ff8fc4;
    --void: #000000;      /* 보이드 검정 */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;   /* 화면 밖 여백은 검정 */
  }

  /* 화면 최하단 장식: 정중앙을 경계로 좌우 이미지를 각각 cover */
  #edge-decor {
    position: fixed;
    inset: 0;
    display: flex;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .edge-decor-half {
    flex: 0 0 50%;
    width: 50%;
    height: 100%;
    background-repeat: no-repeat;
    background-size: contain;
    opacity: 0.3;
  }

  .edge-decor-left {
    background-image: url('left.png');
    background-position: left center;
  }

  .edge-decor-right {
    background-image: url('Right.png');
    background-position: right center;
  }

  /* 무대: 2560x1440 비율을 유지하며 화면에 꽉 차게(레터박스) */
  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2560px;
    height: 1440px;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
    transform-origin: center center;
    z-index: 1;
  }

  /* 배경 그래픽 (마름모 구멍 뚫린 web PNG) — 페이지별로 쌓인 레이어를 JS가 opacity로 전환 */
  .page-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 650ms ease-in-out;
  }

  #bg-page-0 { opacity: 1; } /* 맨 아래 기본 레이어(pg1.png)는 항상 표시 */

  /* pg11.png만 좌우(가로축 기준) 반전 표시 */
  .page-layer.flip-x { transform: scaleX(-1); }

  /* 검정 마름모 (실물 책 자리) — 정방형 회전 */
  #void {
    position: absolute;
    left: 1280px;              /* 중심 x */
    top: 720px;                /* 중심 y */
    width: 1018px;             /* 정방형 한 변 (1440/√2) */
    height: 1018px;
    transform: translate(-50%, -50%) rotate(45deg);
    background: var(--void);
  }

  /* perspective 컨테이너: 마름모 중심(1280,720)에 고정, 자식 3D 기준점 */
  #glyph-scene {
    position: absolute;
    left: 1280px;
    top: 720px;
    width: 0;
    height: 0;
    perspective: 1400px;
    transform-style: preserve-3d;
  }

  /* 마름모 안 한자 — 회전 안 함(똑바로), 마름모 중앙 */
  /* --ox / --oy : 글자별 시각 보정(JS의 OFFSETS에서 주입) */
  .glyph {
    position: absolute;
    left: 0;
    top: 0;
    --ox: 0px;
    --oy: 0px;
    font-family: "Kaiti SC", serif;
    font-weight: 700;
    font-size: 520px;
    line-height: 1;
    opacity: 0.72;  /* flip 종료~idle 재시작 사이 flash 방지 */
    color: var(--pink);
    user-select: none;
    /* 핑크 글로우 + 아이들링 맥동 */
    animation: idle 3.6s ease-in-out infinite;
    will-change: opacity, text-shadow, transform;
    backface-visibility: hidden;
  }

  #glyph-next {
    visibility: hidden;
  }

  /* 0페이지(표지): 한자 대신 보이드 안에 표시되는 이미지(태극) */
  .glyph.is-image img {
    display: block;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 640px;
    height: 640px;
    object-fit: contain;
    animation: idleGlow 3.6s ease-in-out infinite;
    will-change: filter;
  }

  #glyph-scene.is-rolling #glyph.is-image img {
    animation: glyphOutGlow 760ms cubic-bezier(0.55, 0.05, 0.45, 0.95) both;
  }

  #glyph-scene.is-rolling #glyph-next.is-image img {
    animation: glyphInGlow 760ms cubic-bezier(0.55, 0.05, 0.45, 0.95) both;
  }

  /* 異端처럼 두 글자인 경우: 마름모 중앙에 세로로 쌓아 배치 */
  .glyph.is-combo {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .glyph.is-combo .glyph-char {
    display: block;
    font-size: 300px;
    line-height: 1.05;
  }

  #glyph-scene.is-rolling .glyph { animation: none; }

  #glyph-scene.is-rolling #glyph {
    animation: glyphOut 760ms cubic-bezier(0.55, 0.05, 0.45, 0.95) both;
  }

  #glyph-scene.is-rolling #glyph-next {
    visibility: visible;
    animation: glyphIn 760ms cubic-bezier(0.55, 0.05, 0.45, 0.95) both;
  }

  @keyframes idle {
    0%, 100% {
      opacity: 0.72;
      text-shadow:
        0 0 18px rgba(244,91,168,0.55),
        0 0 44px rgba(244,91,168,0.35),
        0 0 90px rgba(255,143,196,0.22);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) scale(1.0);
    }
    50% {
      opacity: 1;
      text-shadow:
        0 0 26px rgba(255,143,196,0.85),
        0 0 70px rgba(244,91,168,0.55),
        0 0 140px rgba(255,143,196,0.4);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) scale(1.035);
    }
  }

  /* 현재 면은 위로, 다음 면은 아래에서 중심으로 동시에 회전 */
  @keyframes glyphOut {
    0% {
      opacity: 0.72;
      text-shadow:
        0 0 18px rgba(244,91,168,0.55),
        0 0 44px rgba(244,91,168,0.35),
        0 0 90px rgba(255,143,196,0.22);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) translateY(0) rotateX(0deg);
    }
    100% {
      opacity: 0;
      text-shadow:
        0 0 18px rgba(244,91,168,0),
        0 0 44px rgba(244,91,168,0),
        0 0 90px rgba(255,143,196,0);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) translateY(-310px) rotateX(90deg);
    }
  }

  @keyframes glyphIn {
    0% {
      opacity: 0;
      text-shadow:
        0 0 18px rgba(244,91,168,0),
        0 0 44px rgba(244,91,168,0),
        0 0 90px rgba(255,143,196,0);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) translateY(310px) rotateX(-90deg);
    }
    100% {
      opacity: 0.72;
      text-shadow:
        0 0 18px rgba(244,91,168,0.55),
        0 0 44px rgba(244,91,168,0.35),
        0 0 90px rgba(255,143,196,0.22);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) translateY(0) rotateX(0deg);
    }
  }

  /* 태극 이미지용 글로우(text-shadow 대신 filter로 동일한 핑크 글로우 표현) */
  @keyframes idleGlow {
    0%, 100% {
      filter:
        drop-shadow(0 0 18px rgba(244,91,168,0.55))
        drop-shadow(0 0 44px rgba(244,91,168,0.35))
        drop-shadow(0 0 90px rgba(255,143,196,0.22));
    }
    50% {
      filter:
        drop-shadow(0 0 26px rgba(255,143,196,0.85))
        drop-shadow(0 0 70px rgba(244,91,168,0.55))
        drop-shadow(0 0 140px rgba(255,143,196,0.4));
    }
  }

  @keyframes glyphOutGlow {
    0% {
      filter:
        drop-shadow(0 0 18px rgba(244,91,168,0.55))
        drop-shadow(0 0 44px rgba(244,91,168,0.35))
        drop-shadow(0 0 90px rgba(255,143,196,0.22));
    }
    100% {
      filter:
        drop-shadow(0 0 18px rgba(244,91,168,0))
        drop-shadow(0 0 44px rgba(244,91,168,0))
        drop-shadow(0 0 90px rgba(255,143,196,0));
    }
  }

  @keyframes glyphInGlow {
    0% {
      filter:
        drop-shadow(0 0 18px rgba(244,91,168,0))
        drop-shadow(0 0 44px rgba(244,91,168,0))
        drop-shadow(0 0 90px rgba(255,143,196,0));
    }
    100% {
      filter:
        drop-shadow(0 0 18px rgba(244,91,168,0.55))
        drop-shadow(0 0 44px rgba(244,91,168,0.35))
        drop-shadow(0 0 90px rgba(255,143,196,0.22));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .glyph { animation: none; opacity: 0.9; }
    .glyph.is-image img { animation: none; }
    .page-layer { transition-duration: 180ms; }
    #glyph-scene.is-rolling #glyph { animation: glyphOut 180ms ease both; }
    #glyph-scene.is-rolling #glyph-next { animation: glyphIn 180ms ease both; }
    #glyph-scene.is-rolling #glyph.is-image img { animation: glyphOutGlow 180ms ease both; }
    #glyph-scene.is-rolling #glyph-next.is-image img { animation: glyphInGlow 180ms ease both; }
  }
</style>
</head>
<body>
  <div id="edge-decor" aria-hidden="true">
    <div class="edge-decor-half edge-decor-left"></div>
    <div class="edge-decor-half edge-decor-right"></div>
  </div>
  <div id="stage">
    <div id="bg-page-0" class="page-layer" style="background-image:url('pg1.png?v=2')"></div>
    <div id="bg-page-1" class="page-layer" style="background-image:url('pg2.png?v=1')"></div>
    <div id="bg-page-2" class="page-layer" style="background-image:url('pg3.png?v=1')"></div>
    <div id="bg-page-3" class="page-layer" style="background-image:url('pg4.png?v=1')"></div>
    <div id="bg-page-4" class="page-layer" style="background-image:url('page5.png?v=1')"></div>
    <div id="bg-page-5" class="page-layer" style="background-image:url('page6.png?v=1')"></div>
    <div id="bg-page-6" class="page-layer" style="background-image:url('page7.png?v=1')"></div>
    <div id="bg-page-7" class="page-layer" style="background-image:url('page8.png?v=1')"></div>
    <div id="bg-page-8" class="page-layer" style="background-image:url('page9.png?v=1')"></div>
    <div id="bg-page-9" class="page-layer" style="background-image:url('page10.png?v=1')"></div>
    <div id="bg-page-10" class="page-layer flip-x" style="background-image:url('pg11.png?v=1')"></div>
    <div id="bg-page-11" class="page-layer" style="background-image:url('page12.png?v=1')"></div>
    <div id="bg-page-12" class="page-layer" style="background-image:url('page13.png?v=1')"></div>
    <div id="void"></div>
    <div id="glyph-scene">
      <div id="glyph" class="glyph"></div>
      <div id="glyph-next" class="glyph">一</div>
    </div>
  </div>

<script>
  // ── 글자별 시각 보정 오프셋 (단위: px, 양수 = 오른쪽·아래) ──────────────
  // Kaiti SC 폰트는 글자마다 em-box 내 획 위치가 달라 미세 조정이 필요함.
  // ox: 좌우 보정 (양수 → 오른쪽)
  // oy: 상하 보정 (양수 → 아래)
  const OFFSETS = {
    '一': { ox:  0, oy: 40 },  // ← 실측 후 조정
    '二': { ox:  0, oy: 20 },
    '三': { ox:  0, oy:  0 },
    '四': { ox:  0, oy:  0 },
    '五': { ox:  0, oy:  0 },
    '六': { ox:  0, oy:  0 },
    '七': { ox:  0, oy:  0 },
    '八': { ox:  0, oy:  0 },
    '異端': { ox: 0, oy: 0 },
  };

  // 페이지별 보이드 콘텐츠(마름모 안 한자). 0페이지(표지)는 한자 대신 태극 이미지.
  const PAGE_CONTENT = {
    0:  { type: 'image', src: 'yinandyang.png?v=1' },
    1:  { type: 'text', char: '一' },
    2:  { type: 'text', char: '二' },
    3:  { type: 'text', char: '三' },
    4:  { type: 'text', char: '四' },
    5:  { type: 'text', char: '四' },
    6:  { type: 'text', char: '五' },
    7:  { type: 'text', char: '六' },
    8:  { type: 'text', char: '七' },
    9:  { type: 'text', char: '八' },
    10: { type: 'text', char: '異端' },
    11: { type: 'text', char: '異端' },
    12: { type: 'text', char: '異端' },
  };
  const LAST_PAGE = 12;

  function setGlyph(page, elementId = 'glyph') {
    const el = document.getElementById(elementId);
    const content = PAGE_CONTENT[page];

    if (content.type === 'image') {
      el.classList.remove('is-combo');
      el.classList.add('is-image');
      el.style.setProperty('--ox', '0px');
      el.style.setProperty('--oy', '0px');
      el.innerHTML = '';
      const img = document.createElement('img');
      img.src = content.src;
      el.appendChild(img);
      return;
    }

    el.classList.remove('is-image');
    const isCombo = content.char.length > 1;
    const { ox = 0, oy = 0 } = OFFSETS[content.char] ?? {};
    el.style.setProperty('--ox', ox + 'px');
    el.style.setProperty('--oy', oy + 'px');

    el.classList.toggle('is-combo', isCombo);
    if (isCombo) {
      el.innerHTML = '';
      for (const ch of content.char) {
        const span = document.createElement('span');
        span.className = 'glyph-char';
        span.textContent = ch;
        el.appendChild(span);
      }
    } else {
      el.textContent = content.char;
    }
  }

  function titleGlyph(page) {
    const content = PAGE_CONTENT[page];
    return content.type === 'text' ? content.char : String(page);
  }

  // 초기 콘텐츠 세팅: 0페이지(태극)에서 시작
  setGlyph(0);
  setGlyph(1, 'glyph-next');

  // ── 페이지 전환: 배경 크로스페이드 + 위 방향 글리프 롤 ──
  const stage = document.getElementById('stage');
  const glyphScene = document.getElementById('glyph-scene');
  const glyph = document.getElementById('glyph');
  let isTransitioning = false;
  let currentPage = 0;
  let targetPage = 0;

  // 페이지별 배경 레이어(0번은 항상 켜져 있는 기본 레이어)
  const bgLayers = [];
  for (let i = 0; i <= LAST_PAGE; i++) {
    bgLayers.push(document.getElementById('bg-page-' + i));
  }

  function updateBackgrounds(page) {
    for (let i = 1; i <= LAST_PAGE; i++) {
      bgLayers[i].style.opacity = i <= page ? '1' : '0';
    }
  }

  // 클릭 전에 다음 이미지들을 브라우저 캐시에 준비한다.
  [
    './pg1.png?v=2', './pg2.png?v=1', './pg3.png?v=1', './pg4.png?v=1',
    './page5.png?v=1', './page6.png?v=1', './page7.png?v=1', './page8.png?v=1',
    './page9.png?v=1', './page10.png?v=1', './pg11.png?v=1', './page12.png?v=1', './page13.png?v=1',
    './yinandyang.png?v=1',
  ].forEach((src) => {
    const preload = new Image();
    preload.src = src;
  });

  function goToPage(page) {
    if (isTransitioning || page === currentPage || !PAGE_CONTENT[page]) return;

    isTransitioning = true;
    targetPage = page;
    setGlyph(page, 'glyph-next');
    updateBackgrounds(page);
    glyphScene.classList.add('is-rolling');
  }

  // 기존 클릭 동작도 유지한다: 현재 페이지에서 다음 페이지로 이동.
  stage.addEventListener('click', () => goToPage(currentPage + 1));

  // 페이지 넘김에서 제외할 키: 숫자(직접 페이지 이동용), 방향키, 커맨드/컨트롤/알트, esc 등
  const NAV_EXCLUDED_CODES = new Set([
    'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
    'MetaLeft', 'MetaRight',
    'ControlLeft', 'ControlRight',
    'AltLeft', 'AltRight',
    'ShiftLeft', 'ShiftRight',
    'Escape', 'Tab', 'CapsLock', 'ContextMenu',
    'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12',
  ]);

  // 숫자키 0~9로 해당 페이지(0~9)에 바로 이동. 10~12(異端)는 스페이스바로만 진입.
  const DIGIT_PAGE_MAP = {};
  for (let d = 0; d <= 9; d++) {
    DIGIT_PAGE_MAP['Digit' + d] = d;
    DIGIT_PAGE_MAP['Numpad' + d] = d;
  }

  document.addEventListener('keydown', (event) => {
    if (event.repeat) return;

    if (event.code in DIGIT_PAGE_MAP) {
      goToPage(DIGIT_PAGE_MAP[event.code]);
      return;
    }

    // 커맨드/컨트롤/알트 조합(단축키)은 페이지 넘김에서 제외
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (NAV_EXCLUDED_CODES.has(event.code)) return;

    event.preventDefault();
    goToPage(currentPage + 1);
  });

  glyph.addEventListener('animationend', (event) => {
    if (!isTransitioning || event.animationName !== 'glyphOut') return;

    setGlyph(targetPage);
    glyphScene.classList.remove('is-rolling');
    isTransitioning = false;
    currentPage = targetPage;
    document.title = `麵道 · ${titleGlyph(currentPage)}`;
  });

  // ── 화면 크기에 맞춰 무대(2560x1440)를 비율 유지하며 꽉 차게 스케일 ──
  function fit() {
    const sx = window.innerWidth  / 2560;
    const sy = window.innerHeight / 1440;
    const scale = Math.min(sx, sy) * 0.85; // 실물 책 85% 축소 인쇄에 맞춘 고정 축소
    document.getElementById('stage')
      .style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
