
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麵道 · 0</title>
<style>
  /* ===== 확정 수치 (27인치 5K 아이맥 기준) =====
     화면 표시영역 : 2560 x 1440 (CSS px)
     환율          : 1cm = 42.83 CSS px
     마름모(실물책) : 대각선 1440px, 중심 (1280,720)
     실물 책        : 23.76cm 정방형
  ================================================= */
  :root {
    --stage-w: 2560;      /* 기준 폭 */
    --stage-h: 1440;      /* 기준 높이 */
    --rhombus-diag: 1440; /* 마름모 대각선(px) */
    --pink: #f45ba8;      /* 배경 핑크(글로우 색) */
    --pink-soft: #ff8fc4;
    --void: #000000;      /* 보이드 검정 */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;   /* 화면 밖 여백은 검정 */
  }

  /* 무대: 2560x1440 비율을 유지하며 화면에 꽉 차게(레터박스) */
  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2560px;
    height: 1440px;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
    transform-origin: center center;
  }

  /* 배경 그래픽 (마름모 구멍 뚫린 web PNG) */
  .page-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #bg {
    background: url('pg1.png?v=2') center / cover no-repeat;
  }

  #bg-next {
    background: url('pg2.png?v=1') center / cover no-repeat;
    opacity: 0;
    transition: opacity 650ms ease-in-out;
  }

  #bg-third {
    background: url('pg3.png?v=1') center / cover no-repeat;
    opacity: 0;
    transition: opacity 650ms ease-in-out;
  }

  #bg-fourth {
    background: url('pg4.png?v=1') center / cover no-repeat;
    opacity: 0;
    transition: opacity 650ms ease-in-out;
  }

  #stage.is-page-1 #bg-next,
  #stage.is-page-2 #bg-next,
  #stage.is-page-2 #bg-third,
  #stage.is-page-3 #bg-next,
  #stage.is-page-3 #bg-third,
  #stage.is-page-3 #bg-fourth { opacity: 1; }

  /* 검정 마름모 (실물 책 자리) — 정방형 회전 */
  #void {
    position: absolute;
    left: 1280px;              /* 중심 x */
    top: 720px;                /* 중심 y */
    width: 1018px;             /* 정방형 한 변 (1440/√2) */
    height: 1018px;
    transform: translate(-50%, -50%) rotate(45deg);
    background: var(--void);
  }

  /* perspective 컨테이너: 마름모 중심(1280,720)에 고정, 자식 3D 기준점 */
  #glyph-scene {
    position: absolute;
    left: 1280px;
    top: 720px;
    width: 0;
    height: 0;
    perspective: 1400px;
    transform-style: preserve-3d;
  }

  /* 마름모 안 한자 — 회전 안 함(똑바로), 마름모 중앙 */
  /* --ox / --oy : 글자별 시각 보정(JS의 OFFSETS에서 주입) */
  .glyph {
    position: absolute;
    left: 0;
    top: 0;
    --ox: 0px;
    --oy: 0px;
    font-family: "Kaiti SC", serif;
    font-weight: 700;
    font-size: 520px;
    line-height: 1;
    opacity: 0.72;  /* flip 종료~idle 재시작 사이 flash 방지 */
    color: var(--pink);
    user-select: none;
    /* 핑크 글로우 + 아이들링 맥동 */
    animation: idle 3.6s ease-in-out infinite;
    will-change: opacity, text-shadow, transform;
    backface-visibility: hidden;
  }

  #glyph-next {
    visibility: hidden;
  }

  /* 0페이지: 한자 대신 보이드 안에 표시되는 이미지(태극) */
  .glyph.is-image img {
    display: block;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 640px;
    height: 640px;
    object-fit: contain;
    filter: drop-shadow(0 0 18px rgba(244,91,168,0.55)) drop-shadow(0 0 44px rgba(244,91,168,0.35));
  }

  #glyph-scene.is-rolling .glyph { animation: none; }

  #glyph-scene.is-rolling #glyph {
    animation: glyphOut 760ms cubic-bezier(0.55, 0.05, 0.45, 0.95) both;
  }

  #glyph-scene.is-rolling #glyph-next {
    visibility: visible;
    animation: glyphIn 760ms cubic-bezier(0.55, 0.05, 0.45, 0.95) both;
  }

  @keyframes idle {
    0%, 100% {
      opacity: 0.72;
      text-shadow:
        0 0 18px rgba(244,91,168,0.55),
        0 0 44px rgba(244,91,168,0.35),
        0 0 90px rgba(255,143,196,0.22);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) scale(1.0);
    }
    50% {
      opacity: 1;
      text-shadow:
        0 0 26px rgba(255,143,196,0.85),
        0 0 70px rgba(244,91,168,0.55),
        0 0 140px rgba(255,143,196,0.4);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) scale(1.035);
    }
  }

  /* 현재 면은 위로, 다음 면은 아래에서 중심으로 동시에 회전 */
  @keyframes glyphOut {
    0% {
      opacity: 0.72;
      text-shadow:
        0 0 18px rgba(244,91,168,0.55),
        0 0 44px rgba(244,91,168,0.35),
        0 0 90px rgba(255,143,196,0.22);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) translateY(0) rotateX(0deg);
    }
    100% {
      opacity: 0;
      text-shadow:
        0 0 18px rgba(244,91,168,0),
        0 0 44px rgba(244,91,168,0),
        0 0 90px rgba(255,143,196,0);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) translateY(-310px) rotateX(90deg);
    }
  }

  @keyframes glyphIn {
    0% {
      opacity: 0;
      text-shadow:
        0 0 18px rgba(244,91,168,0),
        0 0 44px rgba(244,91,168,0),
        0 0 90px rgba(255,143,196,0);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) translateY(310px) rotateX(-90deg);
    }
    100% {
      opacity: 0.72;
      text-shadow:
        0 0 18px rgba(244,91,168,0.55),
        0 0 44px rgba(244,91,168,0.35),
        0 0 90px rgba(255,143,196,0.22);
      transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) translateY(0) rotateX(0deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .glyph { animation: none; opacity: 0.9; }
    #bg-next, #bg-third, #bg-fourth { transition-duration: 180ms; }
    #glyph-scene.is-rolling #glyph { animation: glyphOut 180ms ease both; }
    #glyph-scene.is-rolling #glyph-next { animation: glyphIn 180ms ease both; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="bg" class="page-layer"></div>
    <div id="bg-next" class="page-layer"></div>
    <div id="bg-third" class="page-layer"></div>
    <div id="bg-fourth" class="page-layer"></div>
    <div id="void"></div>
    <div id="glyph-scene">
      <div id="glyph" class="glyph">一</div>
      <div id="glyph-next" class="glyph">二</div>
    </div>
  </div>

<script>
  // ── 글자별 시각 보정 오프셋 (단위: px, 양수 = 오른쪽·아래) ──────────────
  // Kaiti SC 폰트는 글자마다 em-box 내 획 위치가 달라 미세 조정이 필요함.
  // ox: 좌우 보정 (양수 → 오른쪽)
  // oy: 상하 보정 (양수 → 아래)
  const OFFSETS = {
    '一': { ox:  0, oy: 40 },  // ← 실측 후 조정
    '二': { ox:  0, oy: 20 },
    '三': { ox:  0, oy:  0 },
  };

  // 페이지별 보이드 콘텐츠: 0페이지(pg1.png)는 한자 대신 태극 이미지
  const PAGE_CONTENT = {
    0: { type: 'image', src: 'yinandyang.png?v=1' },
    1: { type: 'text',  char: '一' },
    2: { type: 'text',  char: '二' },
    3: { type: 'text',  char: '三' },
  };

  function setGlyph(page, elementId = 'glyph') {
    const el = document.getElementById(elementId);
    const content = PAGE_CONTENT[page];

    if (content.type === 'image') {
      el.classList.add('is-image');
      el.textContent = '';
      el.style.setProperty('--ox', '0px');
      el.style.setProperty('--oy', '0px');
      let img = el.querySelector('img');
      if (!img) {
        img = document.createElement('img');
        el.appendChild(img);
      }
      img.src = content.src;
    } else {
      el.classList.remove('is-image');
      el.textContent = content.char;
      const { ox = 0, oy = 0 } = OFFSETS[content.char] ?? {};
      el.style.setProperty('--ox', ox + 'px');
      el.style.setProperty('--oy', oy + 'px');
    }
  }

  function titleGlyph(page) {
    const content = PAGE_CONTENT[page];
    return content.type === 'text' ? content.char : String(page);
  }

  // 초기 콘텐츠 세팅: 0페이지(태극)에서 시작
  setGlyph(0);
  setGlyph(1, 'glyph-next');

  // ── 페이지 전환: 배경 크로스페이드 + 위 방향 글리프 롤 ──
  const stage = document.getElementById('stage');
  const glyphScene = document.getElementById('glyph-scene');
  const glyph = document.getElementById('glyph');
  let isTransitioning = false;
  let currentPage = 0;
  let targetPage = 0;

  // 클릭 전에 다음 이미지들을 브라우저 캐시에 준비한다.
  ['./pg1.png?v=2', './pg2.png?v=1', './pg3.png?v=1', './pg4.png?v=1', './yinandyang.png?v=1'].forEach((src) => {
    const preload = new Image();
    preload.src = src;
  });

  function goToPage(page) {
    if (isTransitioning || page === currentPage || !PAGE_CONTENT[page]) return;

    isTransitioning = true;
    targetPage = page;
    setGlyph(page, 'glyph-next');
    stage.classList.toggle('is-page-1', page === 1);
    stage.classList.toggle('is-page-2', page === 2);
    stage.classList.toggle('is-page-3', page === 3);
    glyphScene.classList.add('is-rolling');
  }

  // 기존 클릭 동작도 유지한다: 현재 페이지에서 다음 페이지로 이동.
  stage.addEventListener('click', () => goToPage(currentPage + 1));

  document.addEventListener('keydown', (event) => {
    if (event.repeat) return;

    if (event.code === 'Space') {
      event.preventDefault();
      goToPage(currentPage + 1);
    } else if (event.code === 'Digit0' || event.code === 'Numpad0') {
      goToPage(0);
    } else if (event.code === 'Digit1' || event.code === 'Numpad1') {
      goToPage(1);
    } else if (event.code === 'Digit2' || event.code === 'Numpad2') {
      goToPage(2);
    } else if (event.code === 'Digit3' || event.code === 'Numpad3') {
      goToPage(3);
    }
  });

  glyph.addEventListener('animationend', (event) => {
    if (!isTransitioning || event.animationName !== 'glyphOut') return;

    setGlyph(targetPage);
    glyphScene.classList.remove('is-rolling');
    isTransitioning = false;
    currentPage = targetPage;
    document.title = `麵道 · ${titleGlyph(currentPage)}`;
  });

  // ── 화면 크기에 맞춰 무대(2560x1440)를 비율 유지하며 꽉 차게 스케일 ──
  function fit() {
    const sx = window.innerWidth  / 2560;
    const sy = window.innerHeight / 1440;
    const scale = Math.min(sx, sy) * 0.85; // 실물 책 85% 축소 인쇄에 맞춘 고정 축소
    document.getElementById('stage')
      .style.setProperty('--scale', scale);
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
